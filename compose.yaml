services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-project_manager}
      POSTGRES_USER: ${POSTGRES_USER:-project_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-project_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data

  api:
    build: ./backend
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      TZ: Asia/Tehran
      POSTGRES_DB: ${POSTGRES_DB:-project_manager}
      POSTGRES_USER: ${POSTGRES_USER:-project_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-project_password}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  ui:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "test -d node_modules/next || npm ci; npm run dev -- --webpack --hostname 0.0.0.0"
    environment:
      TZ: Asia/Tehran
      API_INTERNAL_URL: http://api:8000
      WATCHPACK_POLLING: "true"
      NODE_OPTIONS: --max-old-space-size=2048
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    # Build output is intentionally ephemeral. Keeping .next in a named
    # volume can serve stale bundles after source changes on Windows mounts.
    tmpfs:
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
